<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modules Archive</title>
<style>
:root{--bg:#0b0d13;--card:#151923;--border:#2a3140;--text:#f5f5f5;--muted:#9aa4b2;--navbg:#dbe7f1;--navtext:#4d5966;--gold:#c79b3b}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 2.5rem;background:var(--navbg)}
.brand{font-size:2rem;color:#202733;text-decoration:none;font-family:Georgia,serif}.brand span{color:var(--gold);font-style:italic}
.navlinks{display:flex;gap:3rem}.navlinks a{color:var(--navtext);text-decoration:none;font-size:1rem}
header{padding:4rem 2rem 3rem;border-bottom:1px solid #1e2430}
h1{font-size:3rem;margin:0 0 1rem}.small{color:var(--muted);font-size:1.1rem}
.container{max-width:1500px;margin:0 auto;padding:2rem}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.5rem}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin-top:1rem;color:var(--muted)}
a{color:#d9e2ff;text-decoration:none}
.tree{font-family:Menlo,monospace;font-size:.95rem;line-height:1.7}.resource{margin-left:2rem;padding:.15rem 0;color:#c9d4e4}
details{margin-left:1rem;padding:.15rem 0}summary{cursor:pointer}.loading{color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
<a class="brand" href="https://graphe.one/">Studio <span>Graphe</span> One</a>
<div class="navlinks">
<a href="https://graphe.one/Codex/support.html">Support</a>
<a href="https://graphe.one/Codex/support.html">Privacy</a>
<a href="mailto:support@graphe.one">Contact</a>
</div>
</div>
<header>
<h1>Scripture Study Modules</h1>
<p class="small">Filesystem-native multilingual module archive.</p>
<div class="stats" id="stats"></div>
</header>
<div class="container">
<div class="card">
<a href="https://graphe.one/ScriptureStudy/">← Back to ScriptureStudy</a>
</div>
<div class="card">
<h2>Live Archive Tree</h2>
<p class="small">Rendered directly from the live filesystem catalogue.</p>
<div id="catalogue" class="loading">Loading live archive tree…</div>
</div>
</div>
<script>
async function loadCatalogue(){
try{
const response=await fetch('./catalog.json');
const data=await response.json();
const languages=data.languages||[];
let total=0;
languages.forEach(lang=>{Object.values(lang.categories).forEach(resources=>total+=resources.length)});
document.getElementById('stats').innerHTML=`<div>${languages.length} Languages</div><div>${total} Resources</div><div>Live Indexed</div>`;
const container=document.getElementById('catalogue');
container.className='tree';
container.innerHTML=languages.map(lang=>{
const categories=Object.entries(lang.categories)
.filter(([_,resources])=>resources.length>0)
.map(([category,resources])=>`
<details>
<summary>${category} (${resources.length})</summary>
${resources.map(resource=>`<div class="resource">└── <a href="#">${resource.title}</a></div>`).join('')}
</details>`).join('');
return `<details><summary>${lang.language}</summary>${categories}</details>`;
}).join('');
}catch(err){document.getElementById('catalogue').innerHTML='Failed to load archive tree.';console.error(err)}
}
loadCatalogue();
</script>
</body>
</html>
