<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Books Archive</title>
<style>
:root{--bg:#0b0d13;--card:#151923;--border:#2a3140;--text:#f5f5f5;--muted:#9aa4b2}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0}
header{padding:4rem 2rem 3rem;border-bottom:1px solid #1e2430}
h1{font-size:3rem;margin:0 0 1rem}.small{color:var(--muted);font-size:1.1rem}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin-top:1rem;color:var(--muted)}
.container{max-width:1500px;margin:0 auto;padding:2rem}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.5rem;margin-bottom:1.5rem}
a{color:#d9e2ff;text-decoration:none}.tree{font-family:Menlo,monospace;font-size:.95rem;line-height:1.7}.resource{margin-left:2rem;padding:.15rem 0;color:#c9d4e4}
details{margin-left:1rem;padding:.15rem 0}summary{cursor:pointer}.loading{color:var(--muted)}
.topnav,.footerlinks{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.5rem}.footerlinks{margin-top:2rem;color:var(--muted)}
</style>
</head>
<body>
<header>
<h1>Scripture Study Books</h1>
<p class="small">Filesystem-native theological books archive.</p>
<div class="stats" id="stats"></div>
<div class="topnav">
<a href="https://graphe.one/ScriptureStudy/">← Back to ScriptureStudy</a>
</div>
</header>
<div class="container">
<div class="card">
<h2>Live Archive Tree</h2>
<p class="small">Rendered directly from the live Books filesystem catalogue.</p>
<div id="catalogue" class="loading">Loading books archive tree…</div>
</div>
<div class="card">
<div class="footerlinks">
<a href="https://graphe.one/Codex/support.html">Support</a>
<a href="https://graphe.one/Codex/support.html">Privacy</a>
<a href="mailto:support@graphe.one">support@graphe.one</a>
</div>
</div>
</div>
<script>
async function loadCatalogue(){
try{
const response=await fetch('./catalog/master.json');
const data=await response.json();
const collections=data.collections||[];
let total=0;
collections.forEach(c=>total+=c.resources.length);
document.getElementById('stats').innerHTML=`<div>${collections.length} Collections</div><div>${total} Resources</div><div>Live Indexed</div>`;
const container=document.getElementById('catalogue');
container.className='tree';
container.innerHTML=collections.map(collection=>`
<details>
<summary>${collection.collection} (${collection.resources.length})</summary>
${collection.resources.map(resource=>`<div class="resource">└── <a href="#">${resource.title}${resource.extension}</a></div>`).join('')}
</details>`).join('');
}catch(err){document.getElementById('catalogue').innerHTML='Failed to load books archive tree.';console.error(err)}
}
loadCatalogue();
</script>
</body>
</html>
