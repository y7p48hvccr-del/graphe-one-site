<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Graphē One — ScriptureStudy Pro for Mac</title>
<meta name="description" content="Graphē One™ ScriptureStudy Pro — a beautifully crafted Bible study app for Mac. Hundreds of free resources in dozens of languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {--sky:#8fa1b5;--sky-light:#b8cad8;--sky-dark:#5d7289;--gold:#b8943a;--gold-light:#d4aa55;--cream:#f5f0e8}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);overflow-x:hidden}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2rem 3rem;z-index:5}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;text-decoration:none;color:rgba(255,255,255,.92)}
.brand em{color:var(--gold-light);font-style:italic}
.toplinks{display:flex;gap:2.5rem}.toplinks a{color:rgba(255,255,255,.82);text-decoration:none;font-size:15px}
.hero{min-height:100vh;background:linear-gradient(160deg,var(--sky-dark) 0%,var(--sky) 45%,var(--sky-light) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:120px 24px 60px}
.hero-logo{width:240px;height:240px;border-radius:40px;object-fit:contain;background:#b8cad8;box-shadow:0 30px 80px rgba(30,45,61,.4);position:relative;z-index:1}
.hero-badge{margin-top:36px;text-align:center;position:relative;z-index:1}
.studio-name{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:8px}
.app-name{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,8vw,72px);font-weight:300;color:#fff;line-height:1.05}.app-name em{color:var(--gold-light)}
.app-subtitle{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:.15em;color:rgba(255,255,255,.6);margin-top:6px}
.hero-tagline{margin-top:24px;font-size:17px;color:rgba(255,255,255,.8);text-align:center;max-width:480px;line-height:1.6;position:relative;z-index:1}
.hero-cta{margin-top:40px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.platform-text{margin-top:28px;color:rgba(255,255,255,.72);font-size:17px;position:relative;z-index:1}
.btn-primary,.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;font-family:'Cormorant Garamond',serif;font-size:16px;text-decoration:none;border-radius:40px;transition:background .2s,transform .2s}
.btn-primary{background:var(--gold);color:white}.btn-secondary{background:var(--gold);color:white;border:1px solid rgba(255,255,255,.15)}
.btn-primary:hover,.btn-secondary:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="topbar">
<a class="brand" href="https://graphe.one/">Studio <em>Graphē</em> One</a>
<div class="toplinks">
<a href="https://graphe.one/ScriptureStudy/support.html">Support</a>
<a href="https://graphe.one/ScriptureStudy/privacy.html">Privacy</a>
<a href="mailto:support@graphe.one">Contact</a>
</div>
</div>
<section class="hero">
<img class="hero-logo" src="/GrapheOneLogo.png" alt="Graphē One Logo">
<div class="hero-badge">
<div class="studio-name">Studio Graphē One</div>
<div class="app-name">ScriptureStudy <em>Pro</em></div>
<div class="app-subtitle">for macOS</div>
</div>
<div class="hero-tagline">
A multilingual scripture study environment with integrated modules, dictionaries, commentaries and theological resources.
</div>
<div class="hero-cta">
<a class="btn-primary" href="#">Coming Soon to the App Store</a>
<a class="btn-secondary" href="resources/">Resources</a>
</div>
<div class="platform-text">
 iOS 17, iPadOS 17, and macOS 14 or later
</div>
</section>
</body>
</html>
