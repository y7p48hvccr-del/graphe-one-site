<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Studio Graphē One — ScriptureStudy Pro for Mac</title>

  <meta
    name="description"
    content="Graphē One™ ScriptureStudy Pro — a beautifully crafted Bible study app for Mac. Hundreds of free resources in dozens of languages."
  />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================================================
       ROOT COLORS
    ========================================================= */

    :root {
      --sky: #8fa1b5;
      --sky-light: #b8cad8;
      --sky-dark: #5d7289;

      --gold: #b8943a;
      --gold-light: #d4aa55;

      --cream: #f5f0e8;
    }

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Crimson Pro", Georgia, serif;
      background: var(--cream);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

   /* =========================================================
   TOP BAR
========================================================= */

.topbar {
  position: fixed;

  top: 0;
  left: 0;

  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 2rem 3rem;

  z-index: 9999;
}

/* ---------------------------------------------------------
   BRAND
--------------------------------------------------------- */

.brand {
  font-family: "Cormorant Garamond", serif;
  font-size: 22px;

  color: rgba(255,255,255,0.92);
}

/* ---------------------------------------------------------
   NAV LINKS
--------------------------------------------------------- */

.toplinks {
  display: flex;
  gap: 2.5rem;
}

.toplinks a {
  color: rgba(255,255,255,0.82);
  font-size: 15px;

  transition: opacity 0.2s ease;
}

.toplinks a:hover {
  opacity: 0.75;
}
    .brand em {
      color: var(--gold-light);
      font-style: italic;
    }

    /* =========================================================
       HERO SECTION
    ========================================================= */

    .hero {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      position: relative;

      padding: 120px 24px 60px;

      background:
        linear-gradient(
          160deg,
          var(--sky-dark) 0%,
          var(--sky) 45%,
          var(--sky-light) 100%
        );
    }

    /* =========================================================
       HERO LOGO
    ========================================================= */

    .hero-logo {
      width: 240px;
      height: 240px;

      object-fit: contain;

      border-radius: 40px;

      background: #b8cad8;

      box-shadow:
        0 30px 80px rgba(30, 45, 61, 0.4);

      position: relative;
      z-index: 1;
    }

    /* =========================================================
       HERO TITLE BLOCK
    ========================================================= */

    .hero-badge {
      margin-top: 36px;
      text-align: center;

      position: relative;
      z-index: 1;
    }

    .studio-name {
      margin-bottom: 8px;

      font-family: "Cormorant Garamond", serif;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.65);
    }

    .app-name {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 300;
      line-height: 1.05;

      color: white;
    }

    .app-name em {
      color: var(--gold-light);
      font-style: italic;
    }

    .app-subtitle {
      margin-top: 6px;

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      letter-spacing: 0.15em;

      color: rgba(255, 255, 255, 0.6);
    }

    /* =========================================================
       TAGLINE
    ========================================================= */

    .hero-tagline {
      max-width: 480px;
      margin-top: 24px;

      text-align: center;
      line-height: 1.6;
      font-size: 17px;

      color: rgba(255, 255, 255, 0.8);

      position: relative;
      z-index: 1;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    .hero-cta {
      margin-top: 40px;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;

      position: relative;
      z-index: 1;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 14px 32px;

      border-radius: 40px;

      font-family: "Cormorant Garamond", serif;
      font-size: 16px;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .btn-primary {
      background: var(--gold);
      color: white;
    }

    .btn-secondary {
      background: var(--gold);
      border: 1px solid rgba(255, 255, 255, 0.15);

      color: white;
    }

    .btn-primary:hover,
    .btn-secondary:hover {
      transform: translateY(-2px);
    }

    /* =========================================================
       PLATFORM TEXT
    ========================================================= */

    .platform-text {
      margin-top: 28px;

      font-size: 17px;

      color: rgba(255, 255, 255, 0.72);

      position: relative;
      z-index: 1;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 900px) {

      .topbar {
        padding: 1rem;
      }

      .brand {
        font-size: 18px;
        letter-spacing: -0.05em;
      }

      .toplinks {
        gap: 1rem;
      }

      .toplinks a {
        font-size: 13px;
      }

      .hero-logo {
        width: 180px;
        height: 180px;
      }

      .hero-tagline {
        font-size: 16px;
      }

    }

  </style>
</head>

<body>

  <!-- ======================================================
       TOP NAVIGATION
  ======================================================= -->

  <div class="topbar">

    <a class="brand" href="https://graphe.one/">
      Studio <em>Graphē</em> One
    </a>

    <div class="toplinks">
      <a href="https://graphe.one/ScriptureStudy/support.html">
        Support
      </a>

      <a href="https://graphe.one/ScriptureStudy/privacy.html">
        Privacy
      </a>

      <a href="mailto:support@graphe.one">
        Contact
      </a>
    </div>

  </div>

  <!-- ======================================================
       HERO
  ======================================================= -->

  <section class="hero">

    <!-- Logo -->

    <img
      class="hero-logo"
      src="/assets/images/study_pro.png"
      alt="Graphē One Logo"
    />

    <!-- Title Block -->

    <div class="hero-badge">

      <div class="studio-name">
        Studio Graphē One
      </div>

      <div class="app-name">
        ScriptureStudy <em>Pro</em>
      </div>

      <div class="app-subtitle">
        for macOS
      </div>

    </div>

    <!-- Tagline -->

    <div class="hero-tagline">
      A multilingual scripture study environment with integrated modules,
      dictionaries, commentaries and theological resources.
    </div>

    <!-- Buttons -->

    <div class="hero-cta">

      <a class="btn-primary" href="#">
        Coming Soon to the App Store
      </a>

      <a class="btn-secondary" href="resources/">
        Resources
      </a>

    </div>

    <!-- Platform Support -->

    <div class="platform-text">
      iOS 17, iPadOS 17, and macOS 14 or later
    </div>

  </section>

</body>
</html>
